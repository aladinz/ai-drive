<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aladdin AI</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-shell">

    <!-- ============================
         SIDEBAR — Chat History
    ============================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-dot"></div>
          <div class="app-title">Aladdin AI</div>
        </div>
        <button id="new-chat-button">New Chat</button>
      </div>

      <div class="sidebar-body">
        <div class="section-label">Chats</div>
        <ul class="chat-list" id="chat-list"></ul>
      </div>

      <div class="sidebar-footer">
        <button id="import-chat-button">Import Chat</button>
      </div>
    </aside>

    <!-- ============================
         MAIN PANEL
    ============================= -->
    <main class="main-panel">

      <!-- Top Bar -->
      <div class="top-bar">
        <button id="sidebar-toggle">☰</button>

        <div class="top-center">
          <span id="model-name">Model: Unknown</span>
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Idle</span>
        </div>

        <div class="top-right">
          <select id="voice-select" title="Reply voice">
            <optgroup label="Female">
              <option value="af_heart">Heart (US)</option>
              <option value="af_bella">Bella (US)</option>
              <option value="af_nicole">Nicole (US)</option>
              <option value="af_sarah">Sarah (US)</option>
              <option value="af_sky">Sky (US)</option>
              <option value="bf_emma">Emma (UK)</option>
              <option value="bf_isabella">Isabella (UK)</option>
            </optgroup>
            <optgroup label="Male">
              <option value="am_adam">Adam (US)</option>
              <option value="am_michael">Michael (US)</option>
              <option value="am_puck">Puck (US)</option>
              <option value="bm_george">George (UK)</option>
              <option value="bm_daniel">Daniel (UK)</option>
            </optgroup>
          </select>
          <button class="icon-button" id="pass-filter-button" title="Hide unqualified tickers">Show PASS only</button>
          <button class="icon-button" id="voice-input-button" title="Voice input">🎤</button>
          <button class="icon-button" id="tts-toggle-button" title="Toggle voice replies">🔈</button>
          <button class="icon-button" id="clear-chat-button">🗑</button>
        </div>
      </div>

      <!-- Chat Area -->
      <div class="main-area">
        <div class="chat-wrapper">
          <details class="scan-panel" id="scan-panel">
            <summary>Multi-ticker scan</summary>
            <div class="scan-form">
              <input id="tickerInput" placeholder="AAPL, MSFT, NVDA, PLTR or AAPL MSFT NVDA">
              <button class="icon-button" id="scan-button">Scan</button>
              <input id="scan-account" type="number" min="0" step="100" value="10000" title="Account size ($)">
              <input id="scan-risk" type="number" min="0.1" max="5" step="0.1" value="1" title="Risk per trade (%)">
            </div>
            <div class="scan-filters" id="scan-filters">
              <button class="icon-button active" data-filter="all">All</button>
              <button class="icon-button" data-filter="qual">QUALIFIED only</button>
              <button class="icon-button" data-filter="perfect">8/8 only</button>
              <button class="icon-button" id="scan-export">Export Watchlist CSV</button>
              <button class="icon-button" id="scan-journal-export">Journal</button>
            </div>
            <div class="scan-summary" id="scan-summary"></div>
            <div class="scan-progress" id="scan-progress" style="display:none;">
              <div class="scan-progress-bar"><div id="scan-progress-fill"></div></div>
              <span id="scan-progress-text"></span>
            </div>
            <table class="scan-table" id="scan-table" style="display:none;">
              <thead>
                <tr><th>Ticker</th><th>Status</th><th>Score</th><th>Stop%</th><th>R/R T1</th><th>Reason</th><th>Time</th></tr>
              </thead>
              <tbody id="scan-body"></tbody>
            </table>
          </details>
          <div class="chat-log" id="chat-log"></div>

          <!-- Mic status bar -->
          <div id="mic-status-bar" style="display:none;"></div>

          <!-- Input Area -->
          <div class="input-area">
            <div class="input-column">
              <div id="attachment-bar"></div>
              <textarea id="chat-input" placeholder="Send a message..."></textarea>
            </div>

            <button id="attach-button">📎</button>
            <button id="send-button">➤</button>
            <button id="stop-button" style="display:none;">■</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="voicebox.js?v=2.1"></script>
  <script src="app.js?v=2.6"></script>
</body>
</html>
